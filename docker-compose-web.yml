version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: web-service/Dockerfile
    image: square-backend
    container_name: square-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./square-frontend
      dockerfile: Dockerfile
    image: square-frontend
    container_name: square-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend